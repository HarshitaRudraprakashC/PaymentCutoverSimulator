import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id("org.springframework.boot") version "3.5.6"
    id("io.spring.dependency-management") version "1.1.7"
}

group = 'org.payment'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext['testcontainers.version'] = '1.21.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {

    // Web API + request validation (@Valid, @NotBlank, ...)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Database: plain JDBC (no JPA), Postgres driver, Flyway for the schema
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Kafka (used from build step 7; harmless to have now)
    implementation 'org.springframework.kafka:spring-kafka'

    // Health check endpoint: GET /actuator/health
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Lombok (optional; records already remove most boilerplate)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Tests: JUnit 5 + real Postgres and Kafka in Docker via Testcontainers
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}