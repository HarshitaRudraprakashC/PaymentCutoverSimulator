spring:
  application:
    name: payments-cutover-simulator

  # Matches docker-compose.yml. Tests ignore these and use their own containers.
  datasource:
    url: jdbc:postgresql://localhost:5432/cutover
    username: cutover
    password: cutover

  # Flyway runs every file in src/main/resources/db/migration on startup, in order.
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

cutover:
  resolver:
    enabled: true
    min-pending-seconds: 30
    interval-ms: 5000
  recon:
    pending-grace-seconds: 30     # don't touch a pending payment younger than this
    projection-grace-seconds: 30
    gate:
      max-recon-age-minutes: 60     # reconciliation must have run in the last hour
      max-failure-rate: 0.01        # NEW must refuse fewer than 1% of captures
      stuck-pending-seconds: 300
  kafka:
    topic: payment-events
    relay:
      enabled: true
      interval-ms: 500
      batch-size: 100

migration:
  batch-size: 1000          # payments per batch (9 batches in a full run)
  merchants: 200            # spread over this many merchants, so "5%" really means ~10 merchants
  timeout-rate: 0.02        # 2% of captures time out AFTER the processor captured
  bug-rate: 0.05            # step 3: NEW under-captures 5% of payments
  drift-wait-seconds: 30    # how long to wait for Kafka to catch up at the end