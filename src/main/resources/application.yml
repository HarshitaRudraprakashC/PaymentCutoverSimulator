spring:
  application:
    name: payments-cutover-simulator

  # Matches docker-compose.yml. Tests ignore these and use their own containers.
  datasource:
    url: jdbc:postgresql://localhost:5432/cutover
    username: cutover
    password: cutover

  # Flyway runs every file in src/main/resources/db/migration on startup, in order.
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health

cutover:
  resolver:
    enabled: true
    min-pending-seconds: 30
    interval-ms: 5000
  recon:
    pending-grace-seconds: 30     # don't touch a pending payment younger than this
    projection-grace-seconds: 30
    gate:
      max-recon-age-minutes: 60     # reconciliation must have run in the last hour
      max-failure-rate: 0.01        # NEW must refuse fewer than 1% of captures
      stuck-pending-seconds: 300
  kafka:
    topic: payment-events
    relay:
      enabled: true
      interval-ms: 500
      batch-size: 100